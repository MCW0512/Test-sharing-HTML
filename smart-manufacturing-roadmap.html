function parseFormula(source){

function calculate(nodes,scope,id,row,ps,cs,cache=new Map()){

function validate(d){

  if(!Array.isArray(d[key]))error('Missing data: '+key,'缺少数据：'+key);

function roadmapHtml(ps){return title(t('Development roadmap','发展路线图'),t('Select a phase to filter; select a project to explore its connections.','点击阶段筛选，点击项目查看关联。'))+'<div class="phase-grid">'+[...D.phases].sort((a,b)=>a.year-b.year).map(f=>'<button class="phase '+(filter.year===String(f.year)?'selected':'')+'" data-year="'+f.year+'"><b>'+f.year+'</b><h3>'+h(f.name)+'</h3><p>'+h(f.goal)+'</p><small>'+t('Stage gate: ','阶段验收：')+h(f.gate)+'</small></button>').join('')+'</div><div class="panel overflow" style="margin-top:18px"><div class="gantt"><div class="gantt-head"><span>'+t('Project / Owner','项目 / 责任部门')+'</span>'+D.years.map(y=>'<span>'+y+'</span>').join('')+'</div>'+(ps.length?ps.map(p=>'<div class="gantt-row"><button class="project-name" data-project="'+p.id+'">'+esc(p.id)+' '+h(p.name)+'<small>'+h(p.owner)+'</small></button><button class="bar '+(p.progress?'':'planned')+'" style="grid-column:'+(p.start-D.years[0]+2)+' / span '+(p.end-p.start+1)+'" data-project="'+p.id+'" aria-label="'+h(p.name)+' '+p.start+'–'+p.end+'">'+status(p)+' · '+p.progress+'%</button></div>').join(''):empty())+'</div></div><p class="note">'+t('Bars show planned years. Dependencies require relevant deliverables to be ready; overlapping projects need milestone-level coordination.','横条表示计划年度。依赖项目的相关交付物须先就绪，重叠项目需另行协调具体里程碑。')+'</p>'}
function architectureHtml(ps){return title(t('Target manufacturing architecture','目标制造架构'),t('Select a system to inspect its role and related projects.','点击系统查看职责与关联项目。'))+'<div class="panel architecture">'+layers().map((name,i)=>'<div class="layer"><div class="layer-title">'+name+'</div><div class="nodes">'+(D.systems.filter(s=>s.layer===i).map(s=>{const n=ps.filter(p=>p.systems.includes(s.id)).length;return '<button class="node '+(n?'':'dim')+'" data-system="'+s.id+'"><b>'+h(s.name)+'</b><small>'+n+' '+t('related projects','个关联项目')+' →</small></button>'}).join('')||'<small>'+t('No systems defined','尚未定义系统')+'</small>')+'</div></div>').join('')+'<p class="note">'+t('Illustrative architecture. Integrate business systems through controlled APIs and events; keep real-time control and safety interlocks in OT. Security and governance span all layers.','示意架构：通过受控 API 与事件集成业务系统；实时控制与安全联锁保留在 OT 层。安全与治理贯穿各层。')+'</p></div>'}
function portfolioHtml(ps){const sorted=[...ps];if(descending)sorted.sort((a,b)=>b.budget-a.budget);return title(t('Strategic project portfolio','战略项目集'),t('Investment, ownership, progress and expected business value.','投资、责任、进度与预期业务价值。'),'<button id="toggle">'+(cards?t('Table view','表格视图'):t('Card view','卡片视图'))+'</button><button id="sort">'+(descending?t('Original order','原始顺序'):t('Budget: high to low','按投资降序'))+'</button>')+(!ps.length?empty():cards?'<div class="cards">'+sorted.map(p=>'<button class="project-card" data-project="'+p.id+'"><span class="pill">'+esc(domainName(p.domain))+' / '+status(p)+'</span><h3>'+h(p.name)+'</h3><p>'+h(p.value)+'</p><p>'+p.start+'—'+p.end+' · '+h(p.owner)+'</p><footer><span>'+fmt(p.budget)+' '+t('CNY 10k','万元')+'</span><span>'+p.progress+'%</span></footer></button>').join('')+'</div>':'<div class="panel overflow"><table>'+heads([t('Project','项目'),t('Domain','领域'),t('Years','周期'),t('Budget / CNY 10k','投资 / 万元'),t('Progress','进度'),t('Owner','责任部门'),t('Dependencies','前置依赖')])+'<tbody>'+sorted.map(p=>'<tr><td>'+projectButton(p)+'</td><td>'+esc(domainName(p.domain))+'</td><td>'+p.start+'–'+p.end+'</td><td>'+fmt(p.budget)+'</td><td>'+status(p)+' '+p.progress+'%<div class="progress"><i style="width:'+p.progress+'%"></i></div></td><td>'+h(p.owner)+'</td><td>'+p.deps.map(id=>'<button class="text-button" data-project="'+id+'">'+id+'</button>').join(' / ')+'</td></tr>').join('')+'</tbody></table></div>')+'<p class="note">'+t('Budgets are total project estimates in CNY 10,000, not annual allocations. Progress-based spending estimates are illustrative and are not actual costs.','投资为项目总估算，单位万元，并非年度分摊。按进度估算的预算消耗仅为示例，不代表实际成本。')+'</p>'}
function matrixHtml(ps,cs){const rows=cs.filter(c=>!onlyGaps||(result('capability','gap',c,ps,cs).value>=2)),gap=D.formulas.find(f=>f.scope==='capability'&&f.id==='gap');return title(t('Capability maturity matrix','能力成熟度矩阵'),t('Select a capability to update its assessment or explore supporting projects.','点击能力调整评分或查看支撑项目。'),'<button id="gaps">'+(onlyGaps?t('Show all gaps','显示所有差距'):t('Only gaps ≥ 2','仅显示差距 ≥ 2'))+'</button>')+'<div class="panel overflow"><table>'+heads([t('Capability / Domain','能力 / 领域'),t('Owner','责任部门'),t('Current','当前'),t('Target','目标'),h(gap.name),t('Projects: filtered / total','项目：筛选内 / 总数')])+'<tbody>'+rows.map(c=>{const all=D.projects.filter(p=>p.caps.includes(c.id)),matched=ps.filter(p=>p.caps.includes(c.id));return '<tr><td><button class="text-button" data-cap="'+c.id+'"><strong>'+h(c.name)+'</strong></button><br>'+esc(domainName(c.domain))+'</td><td>'+h(c.owner)+'</td><td><span class="level">'+c.now+'</span></td><td><span class="level">'+c.target+'</span></td><td>'+resultHtml(result('capability','gap',c,ps,cs))+'</td><td>'+matched.length+' / '+all.length+'<br>'+matched.map(p=>'<button class="text-button" data-project="'+p.id+'">'+p.id+'</button>').join(' · ')+'</td></tr>'}).join('')+(!rows.length?'<tr><td colspan="6">'+empty()+'</td></tr>':'')+'</tbody></table></div><div class="panel"><strong>'+t('Maturity scale','成熟度尺度')+'</strong><p class="note">'+t('1 Initial · 2 Standardized · 3 Integrated · 4 Optimized · 5 Adaptive. This is a self-assessment model, not a certification.','1 初始 · 2 规范 · 3 集成 · 4 优化 · 5 自适应。本模型用于自评，不代表标准认证。')+'</p><p class="note">'+t('Current gap formula: ','当前差距公式：')+'<code>'+esc(gap.expr)+'</code></p></div>'}
function settingsHtml(){
 if(!draft)draft=clone(D);const names=tabNames(),key=settingsTab;
 const header=title(t('Settings · Master data & formulas','设置 · 主数据与公式'),t('Design items and relationships in a draft, then validate and apply all changes.','先在草稿中设计条目与关联，再校验并统一应用。'));
 const tabs='<div class="settings-tabs">'+Object.entries(names).map(([k,v])=>'<button data-tab="'+k+'" class="'+(key===k?'active':'')+'">'+v+'</button>').join('')+'</div>';
 let body='';
 if(key==='general')body='<div class="panel"><h3>'+h(draft.company)+'</h3><p>'+draft.years.join(' · ')+'</p><button id="editGeneral">'+t('Edit company & planning period','编辑企业与规划周期')+'</button><p class="note">'+t('Four consecutive planning years. Projects and phases must fit the period before you apply changes.','规划周期为四个连续年度，应用前须确保项目与阶段年度均处于周期内。')+'</p><button id="restore">'+t('Restore embedded data into draft','将内置数据恢复至草稿')+'</button></div>';
 else {const rows=draft[key];body='<div class="panel"><div class="section-head"><h3>'+names[key]+' · '+rows.length+'</h3>'+(key==='phases'?'':'<button class="primary" id="addItem">'+t('Add item','新增条目')+'</button>')+'</div><div class="overflow"><table class="setting-table">'+heads(['ID',t('Name','名称'),key==='formulas'?t('Scope / Expression','范围 / 表达式'):t('Details','详情'),t('Actions','操作')])+'<tbody>'+rows.map((x,i)=>'<tr><td><code>'+esc(x.id)+'</code></td><td>'+h(x.name)+'</td><td>'+settingDetail(key,x)+'</td><td><div class="actions"><button data-edit="'+i+'">'+t('Edit','编辑')+'</button>'+(key==='phases'||(key==='formulas'&&required[x.id]===x.scope)?'':'<button data-delete="'+i+'">'+t('Delete','删除')+'</button>')+'</div></td></tr>').join('')+'</tbody></table></div></div>';}
 if(key==='formulas')body+=formulaHelp();
 return header+'<p class="settings-note">'+t('Changes stay in this browser. Apply first, then export JSON or download HTML to share the configuration.','修改仅保存在本浏览器。先应用更改，再导出 JSON 或下载 HTML 分享配置。')+'</p>'+tabs+body+'<p id="settingsError" role="alert" class="error"></p><div class="settings-actions"><span id="dirtyState">'+(dirty?t('Unapplied changes','存在未应用更改'):t('No unapplied changes','暂无未应用更改'))+'</span><button id="discard">'+t('Discard draft','放弃草稿')+'</button><button id="checkDraft">'+t('Validate draft','校验草稿')+'</button><button class="primary" id="applyDraft">'+t('Apply changes','应用更改')+'</button></div>';
}
function settingDetail(key,x){if(key==='projects')return x.start+'–'+x.end+' · '+fmt(x.budget)+' '+t('CNY 10k','万元')+'<br>'+esc(domainName(x.domain,draft));if(key==='systems')return layers()[x.layer];if(key==='caps')return x.now+' → '+x.target+' · '+esc(domainName(x.domain,draft));if(key==='phases')return x.year+' · '+h(x.goal);if(key==='formulas')return '<span class="pill">'+scopeName(x.scope)+'</span><br><code class="formula-code">'+esc(x.expr)+'</code>';return h(x.name)}
function scopeName(s){return {project:t('Project','项目'),capability:t('Capability','能力'),summary:t('Summary','概览')}[s]}
function formulaHelp(){return '<div class="panel"><h3>'+t('Formula reference','公式说明')+'</h3><table class="help-table">'+heads([t('Scope','范围'),t('Fields & functions','字段与函数')])+'<tbody><tr><td>'+scopeName('project')+'</td><td><code>budget, progress, start, end</code></td></tr><tr><td>'+scopeName('capability')+'</td><td><code>now, target</code></td></tr><tr><td>'+scopeName('summary')+'</td><td><code>projectCount, capabilityCount<br>sum(budget), avg(progress), sum(remainingEstimate)<br>capSum(gap), capAvg(gap)</code></td></tr></tbody></table><p>'+t('Use + − * /, parentheses, min(a,b), max(a,b), round(a), abs(a). Refer to another metric by its ID within the same scope. Summary aggregates can read project or capability metrics. IDs are case-sensitive.','支持 + − * /、括号、min(a,b)、max(a,b)、round(a)、abs(a)。使用 ID 引用同范围的其他计算项。概览可汇总项目或能力的计算项，ID 区分大小写。')+'</p><p class="note">'+t('Summary metrics use the filtered portfolio and its covered capabilities. Row metrics appear in item details; gap also drives the matrix. Empty averages return 0; divide-by-zero displays an explicit error. Units are labels, not automatic conversions.','概览计算使用筛选后的项目及其覆盖能力。条目计算项显示在详情中，gap 同时影响矩阵。空集合平均值为 0，除零显示明确错误。单位仅为标签，不自动换算。')+'</p><code>remainingEstimate = budget - spentEstimate</code><p class="note">'+t('Progress is 0–100. Budget values are CNY 10,000. Editing a formula changes its outputs, not the underlying source fields.','进度范围为 0—100，预算单位为万元。公式修改影响计算结果，不回写原始字段。')+'</p></div>'}
const formSchema=()=>({
 projects:[['id','ID','id'],['name',t('Name','名称'),'bi'],['domain',t('Domain','领域'),'domains'],['owner',t('Owner','责任部门'),'bi'],['start',t('Start year','开始年度'),'number'],['end',t('End year','结束年度'),'number'],['budget',t('Budget / CNY 10k','投资 / 万元'),'number'],['progress',t('Progress / %','进度 / %'),'number'],['value',t('Business value / Acceptance target','业务价值 / 验收目标'),'bi'],['deliver',t('Deliverables','交付物'),'bi'],['systems',t('Related systems','关联系统'),'multi:systems'],['caps',t('Supported capabilities','支撑能力'),'multi:caps'],['deps',t('Predecessor projects','前置项目'),'multi:projects']],
 systems:[['id','ID','id'],['name',t('Name','名称'),'bi'],['layer',t('Architecture layer','架构层级'),'layer'],['desc',t('Responsibilities','职责描述'),'bi']],
 caps:[['id','ID','id'],['name',t('Name','名称'),'bi'],['domain',t('Domain','领域'),'domains'],['owner',t('Owner','责任部门'),'bi'],['now',t('Current level / 1–5','当前等级 / 1—5'),'number'],['target',t('Target level / 1–5','目标等级 / 1—5'),'number']],
 phases:[['id','ID','id'],['name',t('Name','名称'),'bi'],['year',t('Year','年度'),'number'],['goal',t('Goal','目标'),'bi'],['gate',t('Stage gate','阶段验收'),'bi']],
 domains:[['id','ID','id'],['name',t('Name','名称'),'bi']],
 formulas:[['id','ID','id'],['name',t('Metric name','计算项名称'),'bi'],['scope',t('Scope','范围'),'scope'],['expr',t('Formula expression','公式表达式'),'formula'],['unit',t('Display unit (optional)','显示单位（可选）'),'biOptional']],

});
function show(type,name,body){$('detailType').textContent=type;$('detailTitle').textContent=name;$('detailBody').innerHTML=body;if(!$('detail').open)$('detail').showModal()}
function editor(key,index=-1){
 const existing=index>=0,x=key==='general'?{company:draft.company,firstYear:draft.years[0]}:existing?clone(draft[key][index]):{id:'',name:{en:'',zh:''},owner:{en:'',zh:''},desc:{en:'',zh:''},value:{en:'',zh:''},deliver:{en:'',zh:''},domain:draft.domains[0]?.id||'',start:draft.years[0],end:draft.years[0],budget:0,progress:0,systems:[],caps:[],deps:[],now:1,target:3,layer:0,scope:'project',expr:'budget * progress / 100',unit:{en:'',zh:''}};
 const schema=formSchema()[key];
 show(t('DRAFT EDITOR','草稿编辑'),(existing?t('Edit ','编辑 '):t('Add ','新增 '))+tabNames()[key],'<form id="itemForm">'+schema.map(([field,label,type])=>{
 const value=x[field],inputId='field_'+field;
 if(type==='bi'||type==='biOptional')return '<fieldset><legend>'+label+'</legend><div class="bilingual"><label class="field">English<input id="'+inputId+'_en" value="'+esc(value?.en||'')+'" '+(type==='bi'?'required':'')+' maxlength="2000"></label><label class="field">中文<input id="'+inputId+'_zh" value="'+esc(value?.zh||'')+'" '+(type==='bi'?'required':'')+' maxlength="2000"></label></div></fieldset>';
 let control='';
 if(type.startsWith('multi:')){const items=draft[type.split(':')[1]].filter(r=>!(field==='deps'&&r.id===x.id));control='<select id="'+inputId+'" multiple>'+items.map(r=>'<option value="'+r.id+'" '+((value||[]).includes(r.id)?'selected':'')+'>'+esc(r.id)+' · '+h(r.name)+'</option>').join('')+'</select><small>'+t('Hold Ctrl / Cmd to select multiple items.','按住 Ctrl / Cmd 选择多个条目。')+'</small>'}
 else if(type==='domains')control='<select required id="'+inputId+'">'+draft.domains.map(r=>'<option value="'+r.id+'" '+(value===r.id?'selected':'')+'>'+h(r.name)+'</option>').join('')+'</select>';
 else if(type==='layer')control='<select id="'+inputId+'">'+layers().map((n,i)=>'<option value="'+i+'" '+(value===i?'selected':'')+'>'+n+'</option>').join('')+'</select>';
 else if(type==='scope')control='<select id="'+inputId+'" '+(existing?'disabled':'')+'>'+['project','capability','summary'].map(s=>'<option value="'+s+'" '+(s===value?'selected':'')+'>'+scopeName(s)+'</option>').join('')+'</select>';
 else if(type==='formula')control='<textarea id="'+inputId+'" rows="3" required maxlength="500" spellcheck="false">'+esc(value)+'</textarea>';
 else control='<input id="'+inputId+'" type="'+(type==='number'?'number':'text')+'" '+(type==='id'&&existing?'readonly':'')+' required '+(type==='id'?'pattern="[A-Za-z][A-Za-z0-9_\\-]{0,30}" maxlength="31"':'step="any"')+' value="'+esc(value??'')+'">';
 return '<label class="field" for="'+inputId+'">'+label+control+'</label>';
 }).join('')+'<p id="editorError" class="error" role="alert"></p>'+(key==='formulas'?'<button type="button" id="previewFormula">'+t('Validate & preview','校验与预览')+'</button><div class="preview" id="formulaPreview" aria-live="polite">'+t('Preview uses the full draft portfolio, not the active filters.','预览使用完整草稿项目集，不受当前筛选影响。')+'</div>':'')+'<div class="actions"><button class="primary" type="submit">'+t('Save to draft','保存至草稿')+'</button><button type="button" id="cancelEditor">'+t('Cancel','取消')+'</button></div><p class="note">'+t('Existing IDs stay fixed so references remain stable. Apply the draft to update the dashboard.','现有 ID 固定以保护关联关系。应用草稿后看板才会更新。')+'</p></form>');
 function read(){const next=clone(x);for(const [field,,type] of schema){if(type==='bi'||type==='biOptional')next[field]={en:$('field_'+field+'_en').value.trim(),zh:$('field_'+field+'_zh').value.trim()};else if(type.startsWith('multi:'))next[field]=Array.from($('field_'+field).selectedOptions).map(x=>x.value);else if(type==='number'||type==='layer'){const raw=$('field_'+field).value;if(raw==='')error('Required number: '+field,'必填数值：'+field);next[field]=Number(raw)}else next[field]=$('field_'+field).value.trim()}return next}
 function candidate(){const next=read(),copy=clone(draft);if(key==='general'){copy.company=next.company;copy.years=Array.from({length:4},(_,i)=>next.firstYear+i)}else if(existing)copy[key][index]=next;else copy[key].push(next);return {copy,next}}
 $('itemForm').onsubmit=e=>{e.preventDefault();try{const {copy}=candidate();
  // Permit multi-record repairs in the draft; Apply remains the full validation boundary.
  if(key==='formulas')validate(copy);else if(key!=='general'){const ids=copy[key].map(x=>x.id);if(new Set(ids).size!==ids.length)error('Duplicate ID.','ID 重复。')}
  draft=copy;dirty=true;$('detail').close();render();
 }catch(e){$('editorError').textContent=e.message}};
 $('cancelEditor').onclick=()=>$('detail').close();
 if(key==='formulas')$('previewFormula').onclick=()=>{try{const {copy,next}=candidate(),nodes=validate(copy),ps=copy.projects,cs=relatedCaps(copy,ps),rows=next.scope==='summary'?[null]:(next.scope==='project'?copy.projects:copy.caps);$('formulaPreview').textContent=rows.length?rows.map(row=>{const r=result(next.scope,next.id,row,ps,cs,nodes);return (row?row.id+' · '+tx(row.name)+': ':'')+(r.error?t('Error: ','错误：')+r.error:fmt(r.value)+' '+tx(next.unit))}).join('\n'):t('Valid formula. No records to preview.','公式有效，暂无条目可供预览。');$('editorError').textContent=''}catch(e){$('formulaPreview').textContent='';$('editorError').textContent=e.message}};
}
function deleteItem(index){const key=settingsTab,item=draft[key][index];if(key==='phases'||(key==='formulas'&&required[item.id]===item.scope))return;
 const refs=key==='systems'?draft.projects.filter(p=>p.systems.includes(item.id)):key==='caps'?draft.projects.filter(p=>p.caps.includes(item.id)):key==='projects'?draft.projects.filter(p=>p.deps.includes(item.id)):key==='domains'?[...draft.projects,...draft.caps].filter(p=>p.domain===item.id):[];
 if(refs.length){$('settingsError').textContent=t('Remove these references first: ','请先移除以下关联：')+refs.map(x=>x.id).join(', ');return}
 if(!confirm(t('Delete from draft: ','从草稿删除：')+tx(item.name)+'?'))return;
 const next=clone(draft);next[key].splice(index,1);try{if(key==='formulas')compile(next);draft=next;dirty=true;render()}catch(e){$('settingsError').textContent=e.message}
}
function draftCheck(apply){try{const nodes=validate(draft);if(apply){D=clone(draft);compiled=nodes;dirty=false;filter={year:'',domain:'',search:''};persist()}else $('settingsError').textContent=t('Draft is valid. Formulas with divide-by-zero will show an error for affected records.','草稿有效。存在除零的公式将在对应条目中显示错误。')}catch(e){$('settingsError').textContent=e.message}}
function switchView(next){if(view==='settingsPage'&&next!=='settingsPage'&&dirty&&!confirm(t('Discard unapplied draft changes?','放弃尚未应用的草稿更改？')))return;if(next!==view){draft=null;dirty=false}view=next;render()}
function bindShell(){
 $('language').onclick=()=>{lang=lang==='en'?'zh':'en';try{localStorage.setItem('smart-manufacturing-language',lang)}catch(e){}render()};
 $('year').onchange=e=>{filter.year=e.target.value;render()};$('domain').onchange=e=>{filter.domain=e.target.value;render()};$('search').oninput=e=>{const start=e.target.selectionStart;filter.search=e.target.value;render();$('search').focus();$('search').setSelectionRange(start,start)};
 $('reset').onclick=()=>{filter={year:'',domain:'',search:''};onlyGaps=false;render()};
 if($('toggle'))$('toggle').onclick=()=>{cards=!cards;render()};if($('sort'))$('sort').onclick=()=>{descending=!descending;render()};if($('gaps'))$('gaps').onclick=()=>{onlyGaps=!onlyGaps;render()};
 $('export').onclick=()=>{if(dirty)return toast(t('Apply or discard your draft before exporting.','请先应用或放弃草稿，再导出。'));download(JSON.stringify(D,null,2),'application/json','smart-manufacturing-data.json')};
 $('import').onclick=()=>{if(dirty)return toast(t('Apply or discard your draft before importing.','请先应用或放弃草稿，再导入。'));$('file').click()};
 $('download').onclick=downloadHTML;$('print').onclick=()=>window.print();
 if(view==='settingsPage'){$('discard').onclick=()=>{if(!dirty||confirm(t('Discard unapplied changes?','放弃未应用更改？'))){draft=clone(D);dirty=false;render()}};$('checkDraft').onclick=()=>draftCheck(false);$('applyDraft').onclick=()=>draftCheck(true);if($('addItem'))$('addItem').onclick=()=>editor(settingsTab);if($('editGeneral'))$('editGeneral').onclick=()=>editor('general');if($('restore'))$('restore').onclick=()=>{if(confirm(t('Replace the draft with the data embedded in this HTML?','使用此 HTML 的内置数据替换草稿？'))){draft=clone(base);dirty=true;render()}}}
}
function project(id){
 const p=D.projects.find(x=>x.id===id);if(!p)return;const ps=activeProjects(),cs=relatedCaps(D,ps),schema=formSchema().projects;
 function display(field){const [,,type]=schema.find(x=>x[0]===field),value=p[field];if(type==='bi')return h(value);if(field==='domain')return esc(domainName(value));if(type.startsWith('multi:')){const key=type.split(':')[1];return value.map(id=>esc(id)+' · '+h(D[key].find(x=>x.id===id).name)).join('<br>')||t('None','无')}return esc(value)}
 function item(field){const [,label]=schema.find(x=>x[0]===field);return '<div id="projectField_'+field+'" class="inline-field"><button class="field-value" data-project-field="'+field+'" data-project-id="'+p.id+'"><small>'+label+' <span aria-hidden="true">✎</span></small><span>'+display(field)+'</span></button></div>'}
 show(scopeName('project')+' / '+p.id,tx(p.name),'<p class="settings-note">'+t('Click any information field to edit it. Save each field to update all views.','点击任意信息字段进行编辑，逐项保存后同步更新所有视图。')+'</p>'+item('name')+'<div class="detail-grid">'+['domain','owner','start','end','budget','progress'].map(item).join('')+'</div>'+['value','deliver','systems','caps','deps'].map(item).join('')+'<h3>'+t('Calculated items','计算项')+'</h3>'+metricsHtml('project',p,ps,cs)+'<p class="note">'+t('Calculated values are read-only. Edit their formulas in Settings → Formulas. Spending estimates are not actual costs.','计算结果为只读，请在设置 → 计算公式中修改公式。预算消耗估算不代表实际成本。')+'</p><h3>'+t('Explore related items','查看关联条目')+'</h3><div class="chips">'+p.systems.map(id=>'<button data-system="'+id+'">'+esc(id)+'</button>').join('')+p.caps.map(id=>'<button data-cap="'+id+'">'+esc(id)+'</button>').join('')+p.deps.map(id=>'<button data-project="'+id+'">'+esc(id)+'</button>').join('')+'</div>');
}
function editProjectField(id,field){
 const p=D.projects.find(x=>x.id===id),schema=formSchema().projects.find(x=>x[0]===field);if(!p||!schema||field==='id')return;
 if($('inlineForm')){if(!confirm(t('Discard the unsaved field edit?','放弃当前字段未保存的修改？')))return;project(id)}
 const [,label,type]=schema,value=p[field];let input='';
 if(type==='bi')input='<div class="bilingual"><label class="field">English<textarea id="inline_en" required maxlength="2000" rows="2">'+esc(value.en)+'</textarea></label><label class="field">中文<textarea id="inline_zh" required maxlength="2000" rows="2">'+esc(value.zh)+'</textarea></label></div>';
 else if(type.startsWith('multi:')){const items=D[type.split(':')[1]].filter(x=>!(field==='deps'&&x.id===id));input='<select id="inlineValue" multiple aria-label="'+esc(label)+'">'+items.map(x=>'<option value="'+x.id+'" '+(value.includes(x.id)?'selected':'')+'>'+esc(x.id)+' · '+h(x.name)+'</option>').join('')+'</select><p class="note">'+t('Hold Ctrl / Cmd to select multiple items.','按住 Ctrl / Cmd 选择多个条目。')+'</p>'}
 else if(type==='domains')input='<select id="inlineValue" required aria-label="'+esc(label)+'">'+D.domains.map(x=>'<option value="'+x.id+'" '+(value===x.id?'selected':'')+'>'+h(x.name)+'</option>').join('')+'</select>';
 else input='<input id="inlineValue" aria-label="'+esc(label)+'" type="number" step="'+(field==='budget'?'any':'1')+'" required value="'+value+'">';
 const host=$('projectField_'+field);host.innerHTML='<form id="inlineForm"><strong>'+label+'</strong>'+input+'<p id="inlineError" class="error" role="alert"></p><div class="actions"><button class="primary" type="submit">'+t('Save field','保存字段')+'</button><button type="button" id="cancelInline">'+t('Cancel','取消')+'</button></div></form>';
 $('inlineForm').onsubmit=e=>{e.preventDefault();try{const next=clone(D),item=next.projects.find(x=>x.id===id);item[field]=type==='bi'?{en:$('inline_en').value.trim(),zh:$('inline_zh').value.trim()}:type.startsWith('multi:')?Array.from($('inlineValue').selectedOptions).map(x=>x.value):type==='number'?Number($('inlineValue').value):$('inlineValue').value;validate(next);D=next;persist();project(id)}catch(e){$('inlineError').textContent=e.message}};
 $('cancelInline').onclick=()=>project(id);host.querySelector('textarea,input,select').focus();
}

function system(id){const s=D.systems.find(x=>x.id===id);if(!s)return;show(t('Architecture','制造架构')+' / '+s.id,tx(s.name),'<p>'+h(s.desc)+'</p><h3>'+t('All related projects','全部关联项目')+'</h3><div class="details-list">'+(D.projects.filter(p=>p.systems.includes(id)).map(projectButton).join('')||t('None','无'))+'</div>')}
function cap(id){const c=D.caps.find(x=>x.id===id);if(!c)return;const ps=activeProjects(),cs=relatedCaps(D,ps);show(scopeName('capability')+' / '+c.id,tx(c.name),'<p>'+t('Owner: ','责任部门：')+h(c.owner)+'</p><form id="capForm"><div class="detail-grid"><label class="field">'+t('Current level','当前等级')+'<select id="nowEdit">'+[1,2,3,4,5].map(n=>'<option '+(n===c.now?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label class="field">'+t('Target level','目标等级')+'<select id="targetEdit">'+[1,2,3,4,5].map(n=>'<option '+(n===c.target?'selected':'')+'>'+n+'</option>').join('')+'</select></label></div><button class="primary">'+t('Save assessment','保存评分')+'</button><p id="detailError" class="error" role="alert"></p></form><h3>'+t('Calculated items','计算项')+'</h3>'+metricsHtml('capability',c,ps,cs)+'<h3>'+t('All supporting projects','全部支撑项目')+'</h3><div class="details-list">'+(D.projects.filter(p=>p.caps.includes(id)).map(projectButton).join('')||t('None','无'))+'</div>');$('capForm').onsubmit=e=>{e.preventDefault();try{const next=clone(D),item=next.caps.find(x=>x.id===id);item.now=Number($('nowEdit').value);item.target=Number($('targetEdit').value);validate(next);D=next;persist();cap(id)}catch(e){$('detailError').textContent=e.message}}}
document.addEventListener('click',e=>{const inline=e.target.closest('[data-project-field]');if(inline){editProjectField(inline.dataset.projectId,inline.dataset.projectField);return}const p=e.target.closest('[data-project]'),s=e.target.closest('[data-system]'),c=e.target.closest('[data-cap]'),y=e.target.closest('[data-year]'),v=e.target.closest('[data-view]'),tab=e.target.closest('[data-tab]'),edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(p)project(p.dataset.project);else if(s)system(s.dataset.system);else if(c)cap(c.dataset.cap);else if(y){filter.year=filter.year===y.dataset.year?'':y.dataset.year;render()}else if(v)switchView(v.dataset.view);else if(tab){settingsTab=tab.dataset.tab;render()}else if(edit)editor(settingsTab,Number(edit.dataset.edit));else if(del)deleteItem(Number(del.dataset.delete))});
$('close').onclick=()=>$('detail').close();
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function download(content,type,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function downloadHTML(){if(dirty)return toast(t('Apply or discard your draft before downloading.','请先应用或放弃草稿，再下载。'));const root=document.documentElement.cloneNode(true);root.dataset.snapshot='true';root.querySelector('#app').innerHTML='';root.querySelector('#seed').textContent=JSON.stringify(D).replace(/</g,'\\u003c');root.querySelector('#detail').removeAttribute('open');root.querySelector('#detailBody').innerHTML='';root.querySelector('#toast').textContent='';root.querySelector('#toast').style.display='none';download('<!doctype html>\n'+root.outerHTML,'text/html;charset=utf-8','smart-manufacturing-roadmap.html')}
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2e6)error('JSON file exceeds 2 MB.','JSON 文件超过 2 MB。');const next=migrate(JSON.parse(await f.text()));validate(next);if(confirm(t('Replace current data and formulas with this file?','使用此文件替换当前数据与公式？'))){D=next;draft=null;dirty=false;filter={year:'',domain:'',search:''};persist()}}catch(e){toast(t('Import failed: ','导入失败：')+e.message)}finally{$('file').value=''}};
render();if(startupWarning)toast(startupWarning);

</script></body></html>
